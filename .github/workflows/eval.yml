name: Evals

# Evals call a real model and cost money, so they only run on demand: manually, or when a pull
# request is labeled `run-evals`. Configure EVAL_PROVIDER / EVAL_MODEL as repository variables
# and EVAL_API_KEY as a secret.
on:
  workflow_dispatch:
    inputs:
      repeat:
        description: Runs per case
        default: '1'
  pull_request:
    types: [labeled, synchronize]

jobs:
  eval:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-evals')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: sudo apt-get install -y ripgrep
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/evals src/run.ts --repeat "${{ inputs.repeat || '1' }}" --min-f1 "${{ vars.EVAL_MIN_F1 || '0' }}"
        env:
          EVAL_PROVIDER: ${{ vars.EVAL_PROVIDER }}
          EVAL_MODEL: ${{ vars.EVAL_MODEL }}
          EVAL_VERIFY_MODEL: ${{ vars.EVAL_VERIFY_MODEL }}
          EVAL_API_KEY: ${{ secrets.EVAL_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: packages/evals/reports/
