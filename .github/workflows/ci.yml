name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: sudo apt-get install -y ripgrep
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check
      - run: bun run test
      - run: bun run build
