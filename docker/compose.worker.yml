# The workers alone: reviews and replies. Deploy them with the same variables and database as the
# web app (compose.web.yml). Set HANSI_WORKERS to run more of them; they claim jobs from the
# database, so each job runs once. WORKER_CONCURRENCY sets how many jobs each one runs at a time.
services:
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    environment:
      HANS_MODE: worker
    deploy:
      replicas: ${HANSI_WORKERS:-1}
    volumes:
      # Only used when DATABASE_URL is a file, shared with the web app on the same host.
      - hans-data:/data
      # Checkouts and sandboxes while reviews run. Set HANSI_WORKDIR to a host path, e.g. on a
      # separate disk, to keep them off the system disk; it must be writable by uid 1000.
      - ${HANSI_WORKDIR:-hans-work}:/tmp/hans
    # Reviews run commands in gVisor sandboxes inside this container. runsc creates a user
    # namespace and installs its own seccomp filters, which Docker's default seccomp profile,
    # AppArmor, and SELinux block. The container stays unprivileged. Docker Swarm ignores
    # security_opt, so deploy with `docker compose`, not as a stack or swarm service.
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - label=disable
    # Caps each worker, sandboxes included, so reviews can't take over the host. Each sandbox is
    # also stopped above 2 GiB.
    cpus: ${HANSI_CPUS:-2}
    mem_limit: ${HANSI_MEMORY:-6g}
    restart: unless-stopped

volumes:
  hans-data:
  hans-work:
