# Web + worker share a libSQL file on a volume; reviews run commands on the `sandbox` daemon.
#   cp .env.example .env   # fill in the secrets
#   docker compose -f docker/compose.yml up -d
services:
  hans:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: file:/data/hans.db
      APP_URL: ${APP_URL:-http://localhost:3000}
      ORIGIN: ${APP_URL:-http://localhost:3000}
    ports:
      - '3000:3000'
    volumes:
      - hans-data:/data
      - sandbox-socket:/var/run/hansi-sandbox
    depends_on:
      - sandbox
    restart: unless-stopped

  # The Docker daemon each review runs its commands on, in a fresh gVisor container. Only this
  # container is privileged; hansi reaches it through a socket on a shared volume, never over the
  # network, and its containers can reach the public internet but not hansi or private ranges.
  # Without it (or with SANDBOX=off), reviews only read code.
  sandbox:
    build: sandbox
    privileged: true
    volumes:
      - sandbox-socket:/var/run/hansi-sandbox
      - sandbox-data:/var/lib/docker
    restart: unless-stopped

  # To run web and worker as separate containers, they need a networked database instead of a
  # shared file. Point both at sqld:
  #
  # sqld:
  #   image: ghcr.io/tursodatabase/libsql-server:latest
  #   volumes: [sqld-data:/var/lib/sqld]
  #
  # and set DATABASE_URL=http://sqld:8080 with HANS_MODE=web / HANS_MODE=worker.

volumes:
  hans-data:
  sandbox-socket:
  sandbox-data:
