# Production: the web app and the workers run as separate containers from one image, sharing the
# database: a libSQL file on the hans-data volume, or a sqld server set in DATABASE_URL. Platforms
# such as Dokploy deploy this file as is and route their domain to the hans service on port 3000.
# Set the variables in their UI (they land in a .env next to this file), or in the repository's
# .env.
#
# Locally, `cd docker && docker compose up -d` also loads compose.override.yml, which publishes
# port 3000.
x-hans: &hans
  build:
    context: ..
    dockerfile: docker/Dockerfile
  env_file:
    - path: ../.env
      required: false
    - path: .env
      required: false
  restart: unless-stopped

services:
  # Dashboard and webhooks. Runs the database migrations on start.
  hans:
    <<: *hans
    environment:
      HANS_MODE: web
    volumes:
      - hans-data:/data

  # Reviews and replies. Set HANSI_WORKERS to run more of them; they claim jobs from the database,
  # so each job runs once. WORKER_CONCURRENCY sets how many jobs each one runs at a time.
  worker:
    <<: *hans
    environment:
      HANS_MODE: worker
    deploy:
      replicas: ${HANSI_WORKERS:-1}
    volumes:
      - hans-data:/data
      # Checkouts and sandboxes while reviews run. Set HANSI_WORKDIR to a host path, e.g. on a
      # separate disk, to keep them off the system disk; it must be writable by uid 1000.
      - ${HANSI_WORKDIR:-hans-work}:/tmp/hans
    # Reviews run commands in gVisor sandboxes inside this container. runsc creates a user
    # namespace and installs its own seccomp filters, which Docker's default seccomp profile,
    # AppArmor, and SELinux block. The container stays unprivileged. Docker Swarm ignores
    # security_opt, so deploy with `docker compose`, not as a stack or swarm service.
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - label=disable
    # Caps each worker, sandboxes included, so reviews can't take over the host. Each sandbox is
    # also stopped above 2 GiB.
    cpus: ${HANSI_CPUS:-2}
    mem_limit: ${HANSI_MEMORY:-6g}

volumes:
  hans-data:
  hans-work:
