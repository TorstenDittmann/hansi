# Everything on one host: the web app (compose.web.yml) and the workers (compose.worker.yml),
# sharing the database. To run them as separate deployments, e.g. two Dokploy Compose services,
# point each at its own file instead.
#
# Locally, `cd docker && docker compose up -d` also loads compose.override.yml, which publishes
# port 3000.
include:
  - compose.web.yml
  - compose.worker.yml
