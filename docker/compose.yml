# Production: one container runs web + worker, sharing a libSQL file on a volume. Platforms such
# as Dokploy deploy this file as is and route their domain to port 3000. Set the variables in
# their UI (they land in a .env next to this file), or in the repository's .env.
#
# Locally, `cd docker && docker compose up -d` also loads compose.override.yml, which publishes
# port 3000.
services:
  hans:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    volumes:
      - hans-data:/data
    # Reviews run commands in gVisor sandboxes inside this container. runsc creates a user
    # namespace and installs its own seccomp filters, which Docker's default seccomp profile,
    # AppArmor, and SELinux block. The container stays unprivileged. Docker Swarm ignores
    # security_opt, so deploy with `docker compose`, not as a stack or swarm service.
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - label=disable
    # Caps the whole container, sandboxes included, so reviews can't take over the host. Each
    # sandbox is also stopped above 2 GiB; WORKER_CONCURRENCY sets how many run at once.
    cpus: ${HANSI_CPUS:-2}
    mem_limit: ${HANSI_MEMORY:-6g}
    restart: unless-stopped

  # To run web and worker as separate containers, they need a networked database instead of a
  # shared file. Point both at sqld:
  #
  # sqld:
  #   image: ghcr.io/tursodatabase/libsql-server:latest
  #   volumes: [sqld-data:/var/lib/sqld]
  #
  # and set DATABASE_URL=http://sqld:8080 with HANS_MODE=web / HANS_MODE=worker.

volumes:
  hans-data:
